name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the built installer as release v<version> (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ./scripts/build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: touchstone-editor-windows-x64
          path: dist/Touchstone-Editor-Setup-v*-x64.exe
          if-no-files-found: error

  release:
    # A version tag, or a manual run on main that asks for a release.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: touchstone-editor-windows-x64
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $installer = (Get-Item 'Touchstone-Editor-Setup-v*-x64.exe').Name
          if ($installer -notmatch '^Touchstone-Editor-Setup-(v\d+\.\d+\.\d+)-x64\.exe$') {
            throw "Unexpected installer name: $installer"
          }
          $tag = $Matches[1]
          # A manual run has no tag yet, so the release creates it at the built commit.
          $origin = if ($env:GITHUB_REF_TYPE -eq 'tag') { '--verify-tag' } else { "--target=$env:GITHUB_SHA" }
          $release = gh release view $tag --json assets
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer $origin --title "Touchstone Editor $tag" --generate-notes
          } elseif ($installer -notin ($release | ConvertFrom-Json).assets.name) {
            gh release upload $tag $installer
          }
