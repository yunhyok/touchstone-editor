[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone-editor"
version = "1.0.0"
description = "A Windows editor for Touchstone S-parameter files"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6==6.11.0"]

[project.urls]
Repository = "https://github.com/yunhyok/touchstone-editor"

[tool.setuptools.packages.find]
include = ["touchstone_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
